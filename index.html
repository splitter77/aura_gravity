<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aura Blur</title>
<style>
  :root { --blur: 10px; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #0e0f13; color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }

  /* Home screen */
  #home { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; padding: 24px; }
  #pasteBtn {
    font-size: 22px; font-weight: 600; padding: 18px 48px;
    border: none; border-radius: 16px; cursor: pointer;
    background: linear-gradient(135deg, #6c5ce7, #a66cff); color: white;
    box-shadow: 0 10px 30px rgba(108, 92, 231, .4);
    transition: transform .15s;
  }
  #pasteBtn:active { transform: scale(.96); }
  #hint { opacity: .6; font-size: 14px; max-width: 360px; }
  #error { color: #ff7b7b; font-size: 14px; min-height: 1em; }

  /* Image view */
  #viewer { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; cursor: pointer; }
  #stage { position: relative; line-height: 0; }
  #stage img { max-width: 100vw; max-height: 100vh; display: block; user-select: none; -webkit-user-drag: none; }
  .icon-box {
    position: absolute; border-radius: 22%;
    backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px);
    transition: backdrop-filter .35s ease, -webkit-backdrop-filter .35s ease;
    pointer-events: none;
  }
  .icon-box.badge { border-radius: 999px; }
  .piece { position: absolute; pointer-events: none; will-change: transform; }
  .piece canvas { position: absolute; display: block; border-radius: 22.5%; }
  .piece canvas.badge { border-radius: 999px; }
  #stage.debug .icon-box { outline: 2px solid rgba(0,255,140,.85); }
  #stage.blurred .icon-box {
    backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
  }

</style>
</head>
<body>

<div id="home">
  <button id="pasteBtn">📋 Paste</button>
  <div id="hint">Copy a screenshot, then click “Paste” (or press Ctrl/⌘ + V).</div>
  <div id="error"></div>
</div>

<div id="viewer">
  <div id="stage"><img id="img" alt="" /></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const home = $('home'), viewer = $('viewer'), stage = $('stage'), img = $('img');

let currentImage = null; // loaded HTMLImageElement

/* ---------- Reading the clipboard ---------- */

$('pasteBtn').addEventListener('click', async () => {
  $('error').textContent = '';
  try {
    if (!navigator.clipboard || !navigator.clipboard.read) throw new Error('unsupported');
    const items = await navigator.clipboard.read();
    for (const item of items) {
      const type = item.types.find((t) => t.startsWith('image/'));
      if (type) return loadFromBlob(await item.getType(type));
    }
    $('error').textContent = "No image in the clipboard.";
  } catch (e) {
    $('error').textContent = e.message === 'unsupported'
      ? "Your browser doesn't support reading the clipboard directly: use Ctrl/⌘ + V."
      : "Clipboard access denied. Try Ctrl/⌘ + V.";
  }
});

// Fallback: Ctrl/⌘ + V at any time
window.addEventListener('paste', (e) => {
  const file = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith('image/'))?.getAsFile();
  if (file) { e.preventDefault(); loadFromBlob(file); }
});

function loadFromBlob(blob) {
  const url = URL.createObjectURL(blob);
  const im = new Image();
  im.onload = () => {
    currentImage = im;
    img.src = url;
    home.style.display = 'none';
    viewer.style.display = 'flex';
    stage.classList.remove('blurred');
    runDetection();
  };
  im.onerror = () => { $('error').textContent = "Unable to read the image."; };
  im.src = url;
}
window.loadFromBlob = loadFromBlob;

/* ---------- Icon detection ---------- */

function detectIcons(image) {
  // 1. Downscale for analysis
  const MAX = 1000;
  const scale = Math.min(1, MAX / Math.max(image.naturalWidth, image.naturalHeight));
  const W = Math.max(1, Math.round(image.naturalWidth * scale));
  const H = Math.max(1, Math.round(image.naturalHeight * scale));
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(image, 0, 0, W, H);
  const px = ctx.getImageData(0, 0, W, H).data;
  const N = W * H, minDim = Math.min(W, H);

  // 2. Edge strength (color gradient) + map of colored pixels
  const grad = new Uint16Array(N), color = new Uint8Array(N);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const p = y * W + x, i = p * 4;
      const r0 = px[i], g0 = px[i + 1], b0 = px[i + 2];
      color[p] = Math.max(r0, g0, b0) - Math.min(r0, g0, b0) > 50 ? 1 : 0;
      if (x === W - 1 || y === H - 1) continue;
      const r = i + 4, d = i + W * 4;
      let g = 0;
      for (let c = 0; c < 3; c++) {
        g = Math.max(g, Math.abs(px[i + c] - px[r + c]) + Math.abs(px[i + c] - px[d + c]));
      }
      grad[p] = g;
    }
  }
  const colorSum = integral(color, W, H);
  const sumIn = (S, b) => {
    const x0 = Math.max(0, Math.floor(b.x)), y0 = Math.max(0, Math.floor(b.y));
    const x1 = Math.min(W, Math.ceil(b.x + b.w)), y1 = Math.min(H, Math.ceil(b.y + b.h));
    if (x1 <= x0 || y1 <= y0) return 0;
    const w1 = W + 1;
    return S[y1 * w1 + x1] - S[y0 * w1 + x1] - S[y1 * w1 + x0] + S[y0 * w1 + x0];
  };

  const minSide = Math.max(8, minDim * 0.02);
  const maxSide = minDim * 0.35;
  const isIconShape = (b) =>
    b.w >= minSide && b.h >= minSide && b.w <= maxSide && b.h <= maxSide &&
    b.w / b.h >= 0.8 && b.w / b.h <= 1.25;

  // 3. Multi-threshold (low-contrast icons) and multi-scale analysis:
  //    small dilation = keeps the icon separate from its label,
  //    large dilation = joins the pieces of a line-art icon.
  const unit = Math.max(1, minDim / 500);
  const radii = [...new Set([1, 2, 3, 5, 8].map((r) => Math.max(1, Math.round(r * unit))))];
  const candidates = [];
  for (const T of [22, 40]) {
    const edge = new Uint8Array(N);
    for (let p = 0; p < N; p++) edge[p] = grad[p] > T ? 1 : 0;
    const edgeSum = integral(edge, W, H);
    for (const R of radii) {
      const boxes = components(dilate(edge, W, H, R), W, H)
        .map((b) => ({ x: b.x + R, y: b.y + R, w: b.w - 2 * R, h: b.h - 2 * R }))
        .filter((b) => b.w > 2 && b.h > 2);

      for (const b of boxes) {
        if (!isIconShape(b)) continue;
        const area = b.w * b.h;
        const edges = sumIn(edgeSum, b);
        if (edges < (b.w + b.h) * 0.9) continue;          // too empty
        if (edges > area * 0.55) continue;                 // texture / noise
        const colorful = sumIn(colorSum, b) / area;
        // Text rejection: a letter has neighbors of the same height, aligned and very close.
        if (colorful < 0.15 && looksLikeText(b, boxes)) continue;
        candidates.push(b);
      }
    }
  }

  // 4. Merge candidates from the different scales
  const squareness = (b) => Math.min(b.w, b.h) / Math.max(b.w, b.h); // 1 = perfect square
  candidates.sort((a, b) => a.w * a.h - b.w * b.h);
  const kept = [];
  for (const c of candidates) {
    const dupe = kept.findIndex((k) => iou(c, k) > 0.6);
    if (dupe === -1) kept.push(c);
    else if (squareness(c) > squareness(kept[dupe]) + 0.03) kept[dupe] = c; // keep the squarest
  }
  // Large boxes first:
  //  - contains several icons → merged group, drop it;
  //  - contains a single box almost as large but squarer (icon + label) → drop the enclosing one;
  //  - otherwise it's an icon, and what it contains (its inner artwork) is ignored.
  kept.sort((a, b) => b.w * b.h - a.w * a.h);
  const final = [];
  for (const c of kept) {
    if (final.some((f) => overlap(c, f) > 0.5 * c.w * c.h)) continue;
    const area = c.w * c.h;
    const children = kept.filter((k) => k !== c && overlap(k, c) > 0.8 * k.w * k.h && k.w * k.h > 0.12 * area);
    const big = children.filter((k) => k.w * k.h > 0.55 * area);
    if (big.some((k) => squareness(k) > squareness(c) + 0.03)) continue;
    if (!big.length && children.length >= 2) continue;
    final.push(c);
  }

  // 5. Home screen? Look for a regular grid of same-size icons.
  //    Much more reliable on a photo wallpaper than the analysis above.
  const grid = detectGrid(px, grad, W, H);
  const boxes = grid || final;

  // 6. Square boxes with a small margin, in relative coordinates (0..1)
  const rel = (x, y, w, h) => ({ x: x / W, y: y / H, w: w / W, h: h / H });
  const out = boxes.map((b) => {
    // margin: a few % + 2 analysis pixels (≈ 2 to 4 real px) so nothing sticks out
    const s = Math.max(b.w, b.h) * (grid ? 1.06 : 1.12) + 4;
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    // cut: flush with the icon (so it doesn't take wallpaper with it when falling)
    const c = grid ? Math.max(b.w, b.h) + 1 : s;
    return { ...rel(cx - s / 2, cy - s / 2, s, s), cut: rel(cx - c / 2, cy - c / 2, c, c) };
  });

  // 7. Notification badges (red, top right of the icon)
  boxes.forEach((b, i) => {
    const badge = findBadge(px, W, H, b);
    if (badge) {
      const r = rel(badge.x, badge.y, badge.w, badge.h);
      out.push({ ...r, cut: r, badge: true, of: i });
    }
  });
  return out;
}

function findBadge(px, W, H, icon) {
  const s = Math.max(icon.w, icon.h);
  const x0 = Math.max(0, Math.round(icon.x + 0.5 * s)), x1 = Math.min(W - 1, Math.round(icon.x + 1.4 * s));
  const y0 = Math.max(0, Math.round(icon.y - 0.4 * s)), y1 = Math.min(H - 1, Math.round(icon.y + 0.5 * s));
  const isRed = (x, y) => {
    const i = (y * W + x) * 4, r = px[i], g = px[i + 1], b = px[i + 2];
    return r > 170 && r - g > 90 && r - b > 80;
  };
  // seed: red pixels outside the icon (above or to the right), so as not to confuse with red icon artwork
  const seen = new Uint8Array((x1 - x0 + 1) * (y1 - y0 + 1));
  const idx = (x, y) => (y - y0) * (x1 - x0 + 1) + (x - x0);
  const stack = [];
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const outside = y < icon.y || x > icon.x + icon.w;
    if (outside && isRed(x, y)) { stack.push([x, y]); seen[idx(x, y)] = 1; }
  }
  if (stack.length < s * s * 0.004) return null;
  let minX = W, minY = H, maxX = 0, maxY = 0;
  while (stack.length) {
    const [x, y] = stack.pop();
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
    for (const [nx, ny] of [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]) {
      if (nx < x0 || ny < y0 || nx > x1 || ny > y1 || seen[idx(nx, ny)]) continue;
      seen[idx(nx, ny)] = 1;
      if (isRed(nx, ny)) stack.push([nx, ny]);
    }
  }
  const w = maxX - minX + 1, h = maxY - minY + 1;
  if (h < 0.12 * s || h > 0.6 * s || w > 1.2 * s) return null; // not a badge
  if (maxX >= x1 || minY <= y0) return null; // touches the edge of the zone: it's something else (neighboring icon…)
  const pad = 0.15 * h + 2;
  return { x: minX - pad, y: minY - pad, w: w + 2 * pad, h: h + 2 * pad };
}

/* ---------- Grid mode (home screen) ---------- */

// Score of a square: share of points on each side (straight part, excluding rounded corners)
// that land on an edge. Keep the weakest of the 4 sides.
function sideScore(m, W, x, y, s) {
  const n = 10;
  let min = 1;
  for (let side = 0; side < 4; side++) {
    let c = 0;
    for (let k = 0; k < n; k++) {
      const o = Math.round(s * (0.25 + 0.5 * k / (n - 1)));
      const qx = side < 2 ? x + o : (side === 2 ? x : x + s - 1);
      const qy = side < 2 ? (side === 0 ? y : y + s - 1) : y + o;
      c += m[qy * W + qx];
    }
    min = Math.min(min, c / n);
    if (min === 0) break;
  }
  return min;
}

// Interior near the edge is uniform (icon background) and different from the outside.
function ringScore(px, W, H, x, y, s) {
  const n = 10, ins = Math.max(2, Math.round(s * 0.1)), ou = Math.max(2, Math.round(s * 0.06));
  const inC = [], outC = [];
  const get = (qx, qy, arr) => {
    if (qx < 0 || qy < 0 || qx >= W || qy >= H) return;
    const i = (qy * W + qx) * 4; arr.push([px[i], px[i + 1], px[i + 2]]);
  };
  for (let k = 0; k < n; k++) {
    const o = Math.round(s * (0.25 + 0.5 * k / (n - 1)));
    get(x + o, y + ins, inC); get(x + o, y + s - 1 - ins, inC); get(x + ins, y + o, inC); get(x + s - 1 - ins, y + o, inC);
    get(x + o, y - ou, outC); get(x + o, y + s - 1 + ou, outC); get(x - ou, y + o, outC); get(x + s - 1 + ou, y + o, outC);
  }
  const med = [0, 1, 2].map((c) => inC.map((v) => v[c]).sort((a, b) => a - b)[inC.length >> 1]);
  const dist = (v) => Math.abs(v[0] - med[0]) + Math.abs(v[1] - med[1]) + Math.abs(v[2] - med[2]);
  const uni = inC.filter((v) => dist(v) < 45).length / inC.length;
  const diff = outC.filter((v) => dist(v) > 45).length / Math.max(1, outC.length);
  return { uni, diff };
}

function detectGrid(px, grad, W, H) {
  const N = W * H, minDim = Math.min(W, H);
  const edgeMap = (T, R) => { const e = new Uint8Array(N); for (let p = 0; p < N; p++) e[p] = grad[p] > T ? 1 : 0; return dilate(e, W, H, R); };
  // thickened edges: tolerates a coarse scan step
  const m = edgeMap(24, Math.max(2, Math.round(minDim / 200)));

  // a) "Confident" icons: squares with 4 sharp sides, uniform inner edge, contrast with the outside.
  const seeds = [];
  for (let S = minDim * 0.06; S <= minDim * 0.3; S *= 1.04) {
    const s = Math.round(S), step = Math.max(1, Math.round(s / 16));
    for (let y = 0; y + s < H; y += step) for (let x = 0; x + s < W; x += step) {
      const e = sideScore(m, W, x, y, s);
      if (e < 0.7) continue;
      const { uni, diff } = ringScore(px, W, H, x, y, s);
      const score = e * (0.5 + 0.5 * uni) * diff;
      if (score >= 0.5) seeds.push({ x, y, w: s, h: s, score });
    }
  }
  seeds.sort((a, b) => b.score - a.score);
  const strong = [];
  for (const c of seeds) if (!strong.some((k) => iou(c, k) > 0.3)) strong.push(c);

  // b) Dominant size (ignore small squares contained in a larger one, e.g. a folder's mini-icons)
  const outer = strong.filter((c) => !strong.some((k) => k.w > c.w * 1.3 && overlap(c, k) > 0.7 * c.w * c.h));
  // for each candidate size, measure how well the squares form a grid (shared columns AND rows)
  const cluster = (vals, tol) => {
    vals = [...vals].sort((a, b) => a - b);
    const out = [];
    for (const v of vals) {
      const last = out[out.length - 1];
      if (last && v - last.v / last.n < tol) { last.v += v; last.n++; } else out.push({ v, n: 1 });
    }
    return out.map((c) => ({ c: c.v / c.n, n: c.n }));
  };
  const near = (cl, v) => cl.reduce((a, c) => (Math.abs(c.c - v) < Math.abs(a.c - v) ? c : a));
  let best = [], bestQ = 0;
  for (const c of outer) {
    const g = outer.filter((k) => Math.abs(k.w - c.w) <= 0.1 * c.w);
    if (g.length < 5) continue;
    const tol = 0.4 * c.w;
    const cx = cluster(g.map((b) => b.x + b.w / 2), tol), cy = cluster(g.map((b) => b.y + b.h / 2), tol);
    const aligned = g.filter((b) => near(cx, b.x + b.w / 2).n >= 2 && near(cy, b.y + b.h / 2).n >= 2).length;
    const q = (aligned * aligned / (cx.length * cy.length)) * c.w;
    if (q > bestQ) { bestQ = q; best = g; }
  }
  if (best.length < 5) return null;
  const S = best.map((b) => b.w).sort((a, b) => a - b)[best.length >> 1];

  // c) Columns (at least 2 confident icons) and rows
  const tol = 0.4 * S;
  const colCl = cluster(best.map((b) => b.x + b.w / 2), tol);
  let cols = colCl.filter((c) => c.n >= 2).map((c) => c.c);
  // a row may contain just one confident icon (e.g. the dock), if it's in a known column
  const onCol = best.filter((b) => cols.some((c) => Math.abs(c - (b.x + b.w / 2)) < tol));
  let rows = cluster(onCol.map((b) => b.y + b.h / 2), tol).map((c) => c.c);
  if (cols.length < 2 || rows.length < 2) return null;
  // missing columns / rows: also try one grid pitch before/after and in the gaps
  const extend = (lines, max) => {
    if (lines.length < 2) return lines;
    const pitch = Math.min(...lines.slice(1).map((v, i) => v - lines[i]));
    const extra = [];
    for (let v = lines[0] - pitch; v - S / 2 >= -0.05 * S; v -= pitch) extra.push(v);
    for (let v = lines[lines.length - 1] + pitch; v + S / 2 <= max + 0.05 * S; v += pitch) extra.push(v);
    for (let i = 1; i < lines.length; i++) for (let v = lines[i - 1] + pitch; v < lines[i] - 0.6 * pitch; v += pitch) extra.push(v);
    return lines.concat(extra);
  };
  cols = extend(cols.sort((a, b) => a - b), W);
  rows = extend(rows.sort((a, b) => a - b), H);

  // d) Check each cell, with a slight realignment
  const mLow = edgeMap(14, 1);
  const found = [];
  const r = Math.round(0.2 * S);
  for (const cy of rows) for (const cx of cols) {
    let bestCell = null;
    for (const f of [0.94, 1, 1.06]) {
      const s = Math.round(S * f);
      for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
        const x = Math.round(cx - s / 2 + dx), y = Math.round(cy - s / 2 + dy);
        if (x < 0 || y < 0 || x + s >= W || y + s >= H) continue;
        const e = sideScore(mLow, W, x, y, s);
        if (!bestCell || e > bestCell.e) bestCell = { x, y, w: s, h: s, e };
      }
    }
    if (!bestCell) continue;
    const { diff } = ringScore(px, W, H, bestCell.x, bestCell.y, bestCell.w);
    if (bestCell.e < 0.85 || diff < 0.4) continue;
    found.push(bestCell);
  }
  return found.length >= 4 ? found : null;
}

function looksLikeText(b, boxes) {
  let close = 0;
  for (const o of boxes) {
    if (o === b) continue;
    const hr = o.h / b.h;
    if (hr < 0.4 || hr > 2.5) continue;
    const vOverlap = Math.min(b.y + b.h, o.y + o.h) - Math.max(b.y, o.y);
    if (vOverlap < 0.5 * Math.min(b.h, o.h)) continue;
    const gap = Math.max(o.x - (b.x + b.w), b.x - (o.x + o.w));
    if (gap < 0.45 * b.h) close++;
  }
  return close >= 1;
}

function components(mask, W, H) {
  const seen = new Uint8Array(W * H);
  const stack = new Int32Array(W * H);
  const out = [];
  for (let s = 0; s < W * H; s++) {
    if (!mask[s] || seen[s]) continue;
    let sp = 0, minX = W, minY = H, maxX = 0, maxY = 0;
    stack[sp++] = s; seen[s] = 1;
    while (sp) {
      const p = stack[--sp];
      const x = p % W, y = (p / W) | 0;
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        const q = ny * W + nx;
        if (mask[q] && !seen[q]) { seen[q] = 1; stack[sp++] = q; }
      }
    }
    out.push({ x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 });
  }
  return out;
}

function integral(src, W, H) {
  const w1 = W + 1, S = new Int32Array(w1 * (H + 1));
  for (let y = 0; y < H; y++) {
    let row = 0;
    for (let x = 0; x < W; x++) {
      row += src[y * W + x];
      S[(y + 1) * w1 + x + 1] = S[y * w1 + x + 1] + row;
    }
  }
  return S;
}

function iou(a, b) {
  const o = overlap(a, b);
  return o / (a.w * a.h + b.w * b.h - o);
}

function dilate(src, W, H, R) {
  // separable square dilation via sliding sums
  const tmp = new Uint8Array(W * H), out = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) {
    let sum = 0;
    const row = y * W;
    for (let x = -R; x < W + R; x++) {
      const add = x + R, rem = x - R - 1;
      if (add < W && add >= 0) sum += src[row + add];
      if (rem >= 0 && rem < W) sum -= src[row + rem];
      if (x >= 0 && x < W) tmp[row + x] = sum > 0 ? 1 : 0;
    }
  }
  for (let x = 0; x < W; x++) {
    let sum = 0;
    for (let y = -R; y < H + R; y++) {
      const add = y + R, rem = y - R - 1;
      if (add < H && add >= 0) sum += tmp[add * W + x];
      if (rem >= 0 && rem < H) sum -= tmp[rem * W + x];
      if (y >= 0 && y < H) out[y * W + x] = sum > 0 ? 1 : 0;
    }
  }
  return out;
}

function overlap(a, b) {
  const w = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
  const h = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
  return w > 0 && h > 0 ? w * h : 0;
}

/* ---------- Display ---------- */

let pieces = [];      // a piece = one cut-out icon (+ its badge), moving as a unit
let state = 'idle';   // idle → falling → fallen → returning → idle
let engine = null, rafId = 0;

function runDetection() {
  if (!currentImage) return;
  stopPhysics();
  const icons = detectIcons(currentImage);
  stage.querySelectorAll('.icon-box, .piece').forEach((el) => el.remove());
  stage.classList.remove('blurred');
  state = 'idle';
  const pct = (el, b) => Object.assign(el.style, {
    left: b.x * 100 + '%', top: b.y * 100 + '%', width: b.w * 100 + '%', height: b.h * 100 + '%',
  });

  // blurred areas (visible once the icon has left)
  for (const b of icons) {
    const el = document.createElement('div');
    el.className = b.badge ? 'icon-box badge' : 'icon-box';
    pct(el, b);
    stage.appendChild(el);
  }

  // cut each icon out of the original image
  const nw = currentImage.naturalWidth, nh = currentImage.naturalHeight;
  const cutOut = (c, badge) => {
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(c.w * nw)); cv.height = Math.max(1, Math.round(c.h * nh));
    cv.getContext('2d').drawImage(currentImage, c.x * nw, c.y * nh, c.w * nw, c.h * nh, 0, 0, cv.width, cv.height);
    if (badge) cv.className = 'badge';
    return cv;
  };
  pieces = [];
  icons.forEach((b, i) => {
    if (b.badge) return;
    const el = document.createElement('div');
    el.className = 'piece';
    pct(el, b.cut);
    const icon = cutOut(b.cut);
    Object.assign(icon.style, { left: 0, top: 0, width: '100%', height: '100%' });
    el.appendChild(icon);
    // badge: positioned relative to the piece, it rotates with the icon
    for (const g of icons.filter((k) => k.badge && k.of === i)) {
      const cv = cutOut(g.cut, true);
      Object.assign(cv.style, {
        left: ((g.cut.x - b.cut.x) / b.cut.w) * 100 + '%', top: ((g.cut.y - b.cut.y) / b.cut.h) * 100 + '%',
        width: (g.cut.w / b.cut.w) * 100 + '%', height: (g.cut.h / b.cut.h) * 100 + '%',
      });
      el.appendChild(cv);
    }
    stage.appendChild(el);
    pieces.push({ el, b: b.cut });
  });
}

/* ---------- Physics: random fall, rotation, collisions ---------- */

function stopPhysics() {
  cancelAnimationFrame(rafId);
  if (engine) { Matter.World.clear(engine.world, false); Matter.Engine.clear(engine); engine = null; }
}

function dropAll() {
  const { Engine, Bodies, Body, Composite } = Matter;
  state = 'falling';
  stage.classList.add('blurred');
  const W = stage.clientWidth, H = stage.clientHeight;
  engine = Engine.create();
  engine.gravity.y = 1.4 * (H / 900);   // gravity proportional to the display size

  // floor and walls at the image edges
  const t = 200;
  Composite.add(engine.world, [
    Bodies.rectangle(W / 2, H + t / 2, W * 3, t, { isStatic: true, friction: 0.8 }),
    Bodies.rectangle(-t / 2, H / 2, t, H * 4, { isStatic: true }),
    Bodies.rectangle(W + t / 2, H / 2, t, H * 4, { isStatic: true }),
  ]);

  // one body per icon, static until released (others can bounce off it)
  for (const p of pieces) {
    const w = p.b.w * W, h = p.b.h * H;
    p.x0 = p.b.x * W + w / 2; p.y0 = p.b.y * H + h / 2;
    p.body = Bodies.rectangle(p.x0, p.y0, w, h, {
      isStatic: true, chamfer: { radius: 0.225 * Math.min(w, h) },
      restitution: 0.35, friction: 0.3, frictionAir: 0.012, density: 0.002,
    });
    Composite.add(engine.world, p.body);
  }

  // random order and timing
  const order = [...pieces].sort(() => Math.random() - 0.5);
  let delay = 0;
  order.forEach((p, i) => {
    delay += 60 + Math.random() * 220;
    p.timer = setTimeout(() => {
      Body.setStatic(p.body, false);
      Body.setVelocity(p.body, { x: (Math.random() - 0.5) * 4, y: -1 - Math.random() * 3 });
      Body.setAngularVelocity(p.body, (Math.random() - 0.5) * 0.25);
      if (i === order.length - 1) state = 'fallen';
    }, delay);
  });

  let last = performance.now();
  const tick = (now) => {
    const dt = Math.min(1000 / 30, now - last); last = now;
    Engine.update(engine, dt);
    for (const p of pieces) {
      const { x, y } = p.body.position;
      p.el.style.transform = `translate(${x - p.x0}px, ${y - p.y0}px) rotate(${p.body.angle}rad)`;
    }
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function bringBack() {
  state = 'returning';
  cancelAnimationFrame(rafId);
  pieces.forEach((p) => clearTimeout(p.timer));
  const anims = [...pieces].sort(() => Math.random() - 0.5).map((p, i) => {
    const { x, y } = p.body.position;
    // bring the angle back between -180° and 180° so the return doesn't spin a full turn
    const a = Math.atan2(Math.sin(p.body.angle), Math.cos(p.body.angle));
    const from = `translate(${x - p.x0}px, ${y - p.y0}px) rotate(${a}rad)`;
    p.el.style.transform = '';
    return p.el.animate([{ transform: from }, { transform: 'translate(0, 0) rotate(0rad)' }],
      { duration: 700, delay: i * 45, easing: 'cubic-bezier(.2, .8, .3, 1.1)', fill: 'backwards' }).finished;
  });
  Promise.all(anims).then(() => {
    stopPhysics();
    stage.classList.remove('blurred');
    state = 'idle';
  });
}

// Tap the screen → icons fall / come back
viewer.addEventListener('click', () => {
  if (!pieces.length || typeof Matter === 'undefined') return;
  if (state === 'idle') dropAll();
  else if (state === 'fallen') bringBack();
});

</script>
